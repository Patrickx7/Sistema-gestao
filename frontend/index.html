<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topo">
    <h1>✅ Gerenciador de Tarefas</h1>
    <p class="subtitulo">Organize o dia a dia da dupla</p>
  </header>

  <main class="container">
    <!-- ============ FORMULÁRIO DE CADASTRO / EDIÇÃO ============ -->
    <section class="cartao">
      <h2 id="titulo-form">Nova tarefa</h2>

      <!-- Não usamos <form> com submit tradicional para evitar
           recarregar a página. O JS cuida do clique do botão. -->
      <div class="formulario">
        <!-- Campo escondido que guarda o id quando estamos EDITANDO -->
        <input type="hidden" id="tarefa-id" />

        <label for="titulo">Título *</label>
        <input type="text" id="titulo" placeholder="Ex: Estudar rotas do Express" />

        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" placeholder="Ex: Ler a doc e testar no Postman" />

        <div class="linha-dupla">
          <div>
            <label for="prioridade">Prioridade</label>
            <select id="prioridade">
              <option value="baixa">Baixa</option>
              <option value="media" selected>Média</option>
              <option value="alta">Alta</option>
            </select>
          </div>
          <div>
            <label for="status">Status</label>
            <select id="status">
              <option value="pendente" selected>Pendente</option>
              <option value="fazendo">Fazendo</option>
              <option value="concluida">Concluída</option>
            </select>
          </div>
        </div>

        <div class="botoes">
          <button id="btn-salvar" class="btn btn-primario">Salvar tarefa</button>
          <button id="btn-cancelar" class="btn btn-secundario escondido">Cancelar edição</button>
        </div>

        <p id="mensagem" class="mensagem escondido"></p>
      </div>
    </section>

    <!-- ============ TABELA DE TAREFAS ============ -->
    <section class="cartao">
      <h2>Tarefas</h2>
      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Título</th>
              <th>Descrição</th>
              <th>Prioridade</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-tarefas">
            <!-- As linhas são criadas pelo app.js -->
          </tbody>
        </table>
        <p id="lista-vazia" class="lista-vazia escondido">
          Nenhuma tarefa ainda. Adicione a primeira no formulário acima!
        </p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
