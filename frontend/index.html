<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Estoque</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topo">
    <h1>📦 Gestão de Estoque</h1>
    <p class="subtitulo">Cadastre e acompanhe seus produtos</p>
  </header>

  <main class="container">
    <!-- ============ FORMULÁRIO DE CADASTRO / EDIÇÃO ============ -->
    <section class="cartao">
      <h2 id="titulo-form">Novo produto</h2>

      <!-- Não usamos <form> com submit tradicional para evitar
           recarregar a página. O JS cuida do clique do botão. -->
      <div class="formulario">
        <!-- Campo escondido que guarda o id quando estamos EDITANDO -->
        <input type="hidden" id="produto-id" />

        <label for="nome">Nome *</label>
        <input type="text" id="nome" placeholder="Ex: Teclado mecânico" />

        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" placeholder="Ex: Switch azul, ABNT2" />

        <div class="linha-dupla">
          <div>
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" min="0" step="0.01" placeholder="0,00" />
          </div>
          <div>
            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" min="0" step="1" placeholder="0" />
          </div>
        </div>

        <div class="botoes">
          <button id="btn-salvar" class="btn btn-primario">Salvar produto</button>
          <button id="btn-cancelar" class="btn btn-secundario escondido">Cancelar edição</button>
        </div>

        <p id="mensagem" class="mensagem escondido"></p>
      </div>
    </section>

    <!-- ============ TABELA DE PRODUTOS ============ -->
    <section class="cartao">
      <h2>Produtos cadastrados</h2>
      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Descrição</th>
              <th>Preço</th>
              <th>Qtd.</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-produtos">
            <!-- As linhas são criadas pelo app.js -->
          </tbody>
        </table>
        <p id="lista-vazia" class="lista-vazia escondido">
          Nenhum produto cadastrado ainda. Adicione o primeiro no formulário acima!
        </p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
